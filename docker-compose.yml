# EdgeGuard services. M3: broker only; M6 adds plc_sim, edge_app and dashboard.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edgeguard-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over websockets (dashboard)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
