# Mosquitto 2 broker for EdgeGuard.
# 1883: MQTT for the edge app; 9001: MQTT over websockets for the browser dashboard.
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Demo only: no login, no TLS. A plant network would use passwords/certificates and ACLs.
allow_anonymous true

# Persistence (M4): retained messages and persistent sessions (clean_session=false subscribers,
# e.g. a historian) survive a broker restart, so their queued QoS 1 messages are not lost.
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 1d
log_dest stdout
log_type error
log_type warning
log_type notice
